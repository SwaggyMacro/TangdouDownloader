name: Build and Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag name (for example v0.5)
        required: false
        default: v0.5

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.vars.outputs.TAG_NAME }}
    steps:
      - name: Determine tag name
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG_NAME=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG_NAME }}
          name: ${{ steps.vars.outputs.TAG_NAME }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish ${{ matrix.name }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            rid: win-x64
            executable: TangdouDownloader.Desktop.exe
            asset_name: TangdouDownloader-win-x64.exe
          - name: Linux x64
            os: ubuntu-latest
            rid: linux-x64
            executable: TangdouDownloader.Desktop
            asset_name: TangdouDownloader-linux-x64
          - name: macOS x64
            os: macos-13
            rid: osx-x64
            executable: TangdouDownloader.Desktop
            asset_name: TangdouDownloader-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Restore
        run: dotnet restore TangdouDownloader.slnx

      - name: Publish self-contained desktop app
        run: >-
          dotnet publish TangdouDownloader.Desktop/TangdouDownloader.Desktop.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output publish/${{ matrix.rid }}
          -p:PublishSingleFile=true
          -p:PublishAot=false
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=true
          -p:TrimMode=partial
          -p:PublishReadyToRun=false
          -p:DebuggerSupport=false
          -p:StackTraceSupport=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:StripSymbols=true

      - name: Name single-file application
        shell: pwsh
        run: Move-Item -LiteralPath "publish/${{ matrix.rid }}/${{ matrix.executable }}" -Destination "${{ matrix.asset_name }}"

      - name: Upload executable to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag_name }}
          files: ${{ matrix.asset_name }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
